name: online-auction

services:
  # ---------------------------------------------------------------- Hạ tầng
  postgres:
    image: postgres:16-alpine
    container_name: auction-postgres
    environment:
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: auction123
      POSTGRES_DB: auctiondb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d auctiondb"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: auction-rabbitmq
    environment:
      # Lưu ý: user "guest" mặc định chỉ đăng nhập được từ localhost => tạo user riêng cho các container
      RABBITMQ_DEFAULT_USER: auction
      RABBITMQ_DEFAULT_PASS: auction123
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI: http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  # ---------------------------------------------------------------- Services
  bid-validation:
    build:
      context: .
      dockerfile: src/BidValidation.Service/Dockerfile
    container_name: auction-bid-validation
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5200:5200"

  auction-api:
    build:
      context: .
      dockerfile: src/Auction.API/Dockerfile
    container_name: auction-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AuctionDb: "Host=postgres;Port=5432;Database=auctiondb;Username=auction;Password=auction123"
      GrpcServices__BidValidation: "http://bid-validation:5200"
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: auction
      RabbitMq__Password: auction123
    ports:
      - "5100:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      bid-validation:
        condition: service_started

  audit-worker:
    build:
      context: .
      dockerfile: src/Audit.Worker/Dockerfile
    container_name: auction-audit-worker
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__AuditDb: "Host=postgres;Port=5432;Database=auditdb;Username=auction;Password=auction123"
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: auction
      RabbitMq__Password: auction123
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  web-client:
    build:
      context: .
      dockerfile: src/WebClient/Dockerfile
    container_name: auction-web-client
    environment:
      # Địa chỉ API mà trình duyệt (trên máy host) gọi tới
      ApiBaseUrl: "http://localhost:5100"
    ports:
      - "5300:8080"
    depends_on:
      - auction-api

volumes:
  postgres-data:
  rabbitmq-data:
